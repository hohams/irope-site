name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build iRope
        run: npm run build
        env:
          SITE_URL: https://irope.lt
          PUBLIC_SITE_ID: irope
